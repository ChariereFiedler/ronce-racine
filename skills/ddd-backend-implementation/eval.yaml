fixture: backend-node
prompt: >
  Implement a "register user with unique email" feature in this NestJS
  backend, following DDD layering: domain aggregate with invariants,
  application commands/queries with ports, infrastructure adapters, and a
  handler that only parses input and serializes output.
gates:
  # An implementation skill produces files nobody can enumerate upfront (tests,
  # configs, adapters), so repo_clean is the wrong instrument here. Gate the
  # skill's own non-negotiable invariant instead: dependencies point INWARD, so
  # the domain layer never imports infrastructure or the web framework.
  - grep_zero: { pattern: "from ['\"].*infrastructure|@nestjs|pg['\"]", in: "src/users/domain" }
judge:
  criteria:
    - "Domain, application, infrastructure, handler kept in separate files"
    - "Email uniqueness invariant enforced in the domain, not the handler"
    - "Commands kept separate from queries"
  threshold: pass_all
