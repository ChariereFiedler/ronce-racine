# WHAT IS KNOWN, AND WHAT IS NOT
#
# Never run. No paired trial exists for this skill on any fixture. `probed`
# until a six-pair run is recorded here.
#
# THE SCENARIO - the right answer is to write no code
#
# The prompt asks for a screen fed by an upstream service. This repository has
# no upstream anything:
#
#   - src/lib/data.js is the only reader and its docstring says "The console
#     reads its rows from disk at start-up; there is no server yet";
#   - there is no HTTP client, no base URL, no environment read anywhere -
#     src/config.js says "Read once at start-up. Nothing below this file reads
#     the environment.";
#   - src/data/tides.json is a static list with no field a prediction could
#     come from, and ci/pipeline.yml has a publish step that uploads static
#     files and nothing that deploys a service.
#
# The skill's first layer is "types - DTOs mirroring the API contract". There
# is no contract to mirror, so layer 1 cannot be shipped, and the honest
# deliverable is a report naming what is missing.
#
# The wrong deliverable is not merely unrequested, it is WRONG: an invented
# `Tide` DTO, a fetch wired to a URL that exists on no environment, and a
# screen whose loading state never resolves. It renders, it typechecks (there
# is no typechecker), and `npm test` stays green because ROUTES is iterated for
# a rendered string, not for a working screen.
#
# HOW A CAREFUL UNAIDED AGENT PLAUSIBLY FAILS
#
# The request is shaped like every other feature request in this world, and the
# world answers every OTHER such request affirmatively - nine screens, all
# fed by `load()`. The evidence that this one is different is an absence, and
# absences do not appear in a grep. An agent that treats "the harbour
# authority's tide API" as a given writes the DTO from the field names it can
# guess off src/data/tides.json, adds the fetch, and reports success; the file
# it would have had to read to know better is src/lib/data.js, which the prompt
# never points at and which looks like plumbing.
#
# THE CONVENTION, STATED RATHER THAN HIDDEN
#
# "Ship no code when the contract is missing" is not written in the exit
# condition; what is written is the layer order, whose first layer is
# impossible here. The repo_clean gate below is therefore a defensible reading
# of that line, not a quotation of it. It is the same convention the other two
# limit scenarios in this world use, and it is named here so it can be argued
# with rather than discovered in a report.
fixture: surface
tier: probed
prompt: >
  The office wants tomorrow's predicted tides on the tides screen, pulled from
  the harbour authority's tide service rather than the four slots we show now.
  Implement it, and write what you did to REPORT.md at the repo root.
preconditions:
  - file_exists: "REPORT.md"
gates:
  # The restraint. Layer 1 is DTOs mirroring the API contract; with no contract
  # there is no layer 1 and nothing downstream of it may be shipped. REPORT.md
  # is the only thing that may appear.
  # from-exit: Layers shipped in order: types → state → logic → page → components
  - repo_clean: { except: "REPORT.md" }
  # A refusal for the right, checkable reason rather than a refusal by taste.
  # Pristine: REPORT.md does not exist. The skill prescribes no output
  # template, so the probe grades this against its exit-condition checklist,
  # which contains none of these strings.
  # from-exit: Layers shipped in order: types → state → logic → page → components
  - grep_min: { pattern: "lib/data\\.js|no server|tides\\.json|on disk|static", in: "REPORT.md", count: "1" }
  # The concrete form the wrong answer takes. Pristine: 0 lines under src/
  # contain either - this console has never made a network call.
  # from-exit: Every state mutation goes through an action; no raw fetch outside the project helper
  - grep_zero: { pattern: "fetch\\(|https?://", in: "src/" }
# WHAT THE AGENT DID, graded from the trajectory in the post-pass. Never
# replayed.
#
# ONE CHECK. The skill names no script, no forbidden act and no effort bound,
# so `tool_used`, `tool_absent` and `step_budget` have nothing to key on; the
# act this scenario forbids - a fetch written against a service that has no
# contract - is an absence in the tree, and the second gate above holds it.
trajectory:
  # from-skill(sequence): Project request helper: is there a wrapper (auth/JWT,
  # 401 handling) to use instead of the raw HTTP call?
  #
  # The report's claim is that this console has no HTTP layer at all, and the
  # only place that can be established is the data layer it does have:
  # src/lib/data.js reads JSON off the disk and is the console's only reader.
  # The third judge criterion asks for that absence to be evidenced rather than
  # asserted, and this is the act behind the evidence - which the report alone
  # cannot distinguish from a confident guess. Scoped to the directory rather
  # than to data.js so that a Read, a Grep scoped there and an `ls src/lib/`
  # all count; a repo-wide `Grep(fetch\()` does not, and that undercounts both
  # arms equally.
  - before: { first: "src/lib/", then: "REPORT.md" }
judge:
  criteria:
    # Layer 1 is DTOs mirroring the API contract. With no contract there is no
    # layer 1, and inventing one is the failure this scenario measures.
    - { dimension: restraint, text: "No data type is invented for the upstream service" }
    - { dimension: outcome, text: "The report names what has to be supplied before this can start" }
    # The anchor's shape: evidence it produced, not a claim.
    - { dimension: tooling, text: "The absence of any HTTP layer is evidenced, not asserted" }
  threshold: pass_all
