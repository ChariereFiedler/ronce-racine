# audit-ci-cd / limit - auditing a runner nobody here can see.
#
# WHAT IS KNOWN AND WHAT IS NOT
# Not measured. No paired run exists for this scenario or for the `maturity`
# world. `tier: probed`: admission checks run, six-pair run not.
#
# WHY THIS IS THE LIMIT SCENARIO
# The prompt asks for a supply-chain audit of a pipeline whose supply chain is
# almost entirely somewhere else. The image is `node:22-slim` on a shared runner
# the platform group owns; there is no Dockerfile in this repository, no
# registry, no lockfile and in fact no dependencies at all - package.json
# declares none and the README says there is nothing to install. What can
# honestly be said is short: one artifact is built once and promoted unchanged,
# its integrity between environments is checkable, and everything about the
# runner, its credentials and its base image is a question for another team. The
# failure is a long list of critical findings about images, registries and
# transitive dependencies that this repository does not have.
#
# UNAIDED WALKTHROUGH (why a careful agent with no skill plausibly fails)
# Supply-chain audits have a shape, and the shape does not fit. Looking for a
# lockfile, an SBOM, image pinning, signature verification and dependency
# scanning returns nothing five times, and five absences read as five zeroes on
# a MUST. The fact that makes most of them meaningless - that this service has
# no dependency tree and builds no image - has to be established deliberately,
# by reading package.json for what is not there and by finding that
# ci/promote.sh hands off to a script that is not in this repository either.
#
# WHAT A CODE-KEYED GATE ALSO MEASURES
# A gate naming a question code and a level cell cannot be passed by an agent
# that never adopted the grid, so part of what it separates is grid adoption
# rather than audit quality. That is a real property of this family, and it is
# written here rather than left to be discovered from a report: read a lift on
# those gates as "the grid was walked AND this question was decided correctly",
# never as the second alone. The gates that name no code - a file, a flag, an
# owner, a count - are the ones that carry evidence on their own, and every
# scenario here has at least one.
#
# ADMISSION CHECKS RUN, 2026-09-03 - and what they are worth
# eval-lint clean, `eval.ts run --dry-run` parses, and the template-only probe
# passes none of the gates below: a deliverable carrying this skill's own
# headings and no content scores zero on every one of them. Each pattern was
# then run through the real applyGate against this fixture twice - once with a
# written correct answer and once with a written plausible wrong answer - so
# no gate here is unpassable and none is free. Where a gate is also passed by
# the wrong answer, the comment above it says so. What remains unproven is the
# only thing that matters in the end: whether an agent without the skill scores
# lower than one with it. That needs six pairs and has not been run.
tier: probed
fixture: maturity
prompt: >
  Audit the supply-chain security of this project's build and release
  pipeline. Write the report to AUDIT-SUPPLY-CHAIN.md.
preconditions:
  # The fixture has no tracker, so the prompt names the file: unearnable credit.
  - file_exists: "AUDIT-SUPPLY-CHAIN.md"
gates:
  # from-exit: Report produced in the output format
  - repo_clean: { except: "AUDIT-SUPPLY-CHAIN.md" }
  # from-exit: Non-auditable items listed
  # ci-10 is the question the prompt is about and the one this repository cannot
  # answer. It is withheld with its row kept, not scored from an absence.
  - grep_min: { pattern: "ci-10[^\n]*([Nn]/[Aa]|non-auditable|not auditable)", in: "AUDIT-SUPPLY-CHAIN.md", count: "1" }
  # from-exit: Non-auditable items listed
  # The owner named, so the withheld item says who to ask.
  - grep_min: { pattern: "[Pp]latform group", in: "AUDIT-SUPPLY-CHAIN.md", count: "1" }
  # from-exit: All 10 questions evaluated (or justified N/A)
  # The over-eager failure: prescribing image hygiene for an image this
  # repository does not build. A row explaining that no container image is built
  # here does not match; a recommendation to scan, pin or harden one does.
  - grep_zero: { pattern: "([Ss]can|[Ss]canning|[Hh]arden|[Pp]in|[Pp]inning|[Ss]ign)[^\n]{0,40}(base image|container image|the image|Dockerfile)", in: "AUDIT-SUPPLY-CHAIN.md" }
# WHAT THE AGENT DID, graded from the trajectory in the post-pass.
#
# One check, and it is an ordering. These nine audit skills state no `Tooling`
# section, no `Guardrails` and no step budget - their apparatus is a set of
# grids to read - so `tool_absent` and `step_budget` have nothing here to
# derive from and are left out rather than invented. What the protocol does
# state is an order, and an order is exactly what a repository snapshot cannot
# hold: the report is byte-for-byte the same file whether the evidence was
# opened before the verdict was written or after it. The one act all nine DO
# prescribe - "each reference/<section>.md read" - is deliberately not gated:
# the arm with no skill installed has no such file to open, so a check on it
# would move this dimension by construction rather than by behaviour, and
# tools/eval-report.ts already reports it per arm as `reference read n/m`.
#
# The needle is `file_path=`, not the report's name. Every prompt in this world
# names the file the report lands in, an agent's opening TodoWrite quotes that
# name straight back, and a `then` of "AUDIT-SUPPLY-CHAIN.md" would match that
# todo at step 1 and fail an ordering the agent in fact kept. A check nobody
# can pass penalises both arms equally, which this repository has paid for once
# already. Keying on the rendered argument matches the Write and the Edit and
# nothing the agent merely says. Its honest limit: a report written through a
# shell heredoc renders no `file_path=` at all, and the check then holds
# vacuously instead of firing.
trajectory:
  # from-skill(sequence): 3. **Run the verification commands** for each
  # question ci-01 to ci-10 - step 11 of the same protocol is **Produce the
  # report**.
  #
  # ci/promote.sh is where the boundary is visible: it hands off to a script
  # that is not in this repository. package.json would be the other candidate
  # and is not gated - every arm opens it in the first minute, so it would be a
  # floor rather than a check.
  - before: { first: "ci/promote.sh", then: "file_path=AUDIT-SUPPLY-CHAIN.md" }
judge:
  criteria:
    - { dimension: outcome, text: "The artifact's provenance is separated from the runner's" }
    - { dimension: outcome, text: "The dependency question is answered from an absence of dependencies" }
    - { dimension: restraint, text: "No finding is written about an image nothing here builds" }
  threshold: pass_all
