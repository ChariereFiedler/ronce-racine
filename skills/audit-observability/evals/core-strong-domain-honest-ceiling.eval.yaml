# audit-observability / core - a domain that is genuinely good, with two limits.
#
# WHAT IS KNOWN AND WHAT IS NOT
# Not measured. This manifest replaces one that carried no figure of its own -
# it inherited audit-security's 2026-08-24 calibration on a fifteen-line fixture
# that no longer exists, through gates that greped for the words "confidence"
# and "non-auditable". Nothing here inherits from it. `tier: probed`: the
# admission checks have been run, the six-pair run has not.
#
# WHY THE GATES LOOK LIKE THIS
# The fixture ships a filled observability report for another project
# (docs/audits/2026-05-21-caldmere-fleet-observability.md), so the ob-/al- codes,
# the table and the vocabulary are free to both arms and no gate keys on them.
# What is gated is the level: this world is strong here and an audit that treats
# a checklist as a list of things to be missing scores it wrong.
#
# UNAIDED WALKTHROUGH (why a careful agent with no skill plausibly fails)
# The failure mode of this domain is not blindness, it is asymmetry. An agent
# with no grid reports what is absent - no dashboards, no distributed tracing,
# no APM, no SLO - and produces a low score for a service that emits one JSON
# object per line with a request id that reaches the log lines, the metric
# labels and every stored row, that redacts a named list of personal fields, and
# that has an alert catalogue with a threshold, a severity, an owner and a
# runbook per row plus four runbooks that exist. Two ceilings are real and both
# need care to place correctly: the dashboard tool belongs to the platform group
# and is a withheld question rather than a zero, and detection time is not
# measured - ops/incidents.md says so in as many words - which is a finding, not
# a gap in the audit.
#
# WHAT A CODE-KEYED GATE ALSO MEASURES
# A gate naming a question code and a level cell cannot be passed by an agent
# that never adopted the grid, so part of what it separates is grid adoption
# rather than audit quality. That is a real property of this family, and it is
# written here rather than left to be discovered from a report: read a lift on
# those gates as "the grid was walked AND this question was decided correctly",
# never as the second alone. The gates that name no code - a file, a flag, an
# owner, a count - are the ones that carry evidence on their own, and every
# scenario here has at least one.
#
# PARTLY SATURATED, ADMITTED
# The redaction gate is the soft one: src/log.js declares a REDACT set in its
# fourth line, so an unaided arm reading the logger names it without ever
# opening data/classification.json - the check the gate is meant to stand for.
# It was kept over a stricter pattern requiring both files on one line, which
# would have been unpassable more often than it was informative, and it is the
# gate to look at first if this scenario comes back saturated.
#
# ADMISSION CHECKS RUN, 2026-09-03 - and what they are worth
# eval-lint clean, `eval.ts run --dry-run` parses, and the template-only probe
# passes none of the gates below: a deliverable carrying this skill's own
# headings and no content scores zero on every one of them. Each pattern was
# then run through the real applyGate against this fixture twice - once with a
# written correct answer and once with a written plausible wrong answer - so
# no gate here is unpassable and none is free. Where a gate is also passed by
# the wrong answer, the comment above it says so. What remains unproven is the
# only thing that matters in the end: whether an agent without the skill scores
# lower than one with it. That needs six pairs and has not been run.
tier: probed
fixture: maturity
prompt: >
  Run an observability and alerting audit of this service.
  Write the report to AUDIT-OBSERVABILITY.md.
preconditions:
  # The fixture has no tracker, so the prompt names the file: an agent following
  # no skill produces it too, so it earns nothing among the gates.
  - file_exists: "AUDIT-OBSERVABILITY.md"
gates:
  # from-exit: Strengths, weaknesses and prioritized recommendations (MUST/SHOULD/COULD) filled in
  # This skill's exit condition names no output file, so this is the line that
  # says the deliverable is a report: the audit must not edit what it grades.
  - repo_clean: { except: "AUDIT-OBSERVABILITY.md" }
  # from-exit: Non-auditable items listed explicitly
  # ob-05 (real-time dashboards): the tool, its panels and who watches them are
  # the platform group's. Withheld, not scored from an absence.
  - grep_min: { pattern: "ob-05[^\n]*([Nn]/[Aa]|non-auditable|not auditable)", in: "AUDIT-OBSERVABILITY.md", count: "1" }
  # from-exit: All 15 questions have received a level 0-4 or been marked N/A with justification
  # At least two questions score 3 or 4. The world is genuinely strong here and
  # a uniformly bleak report is as wrong as a uniformly generous one.
  - grep_min: { pattern: "(ob|al)-0[0-9][^\n]*\|\s*[34]\s*\|", in: "AUDIT-OBSERVABILITY.md", count: "2" }
  # from-exit: All 15 questions have received a level 0-4 or been marked N/A with justification
  # The logging guideline is only worth a level if it agrees with the register
  # it points at: docs/logging.md requires the REDACT list in src/log.js and
  # data/classification.json to match. Checking that needs both files open.
  - grep_min: { pattern: "classification\.json|[Rr]edact", in: "AUDIT-OBSERVABILITY.md", count: "1" }
# WHAT THE AGENT DID, graded from the trajectory in the post-pass.
#
# One check, and it is an ordering. These nine audit skills state no `Tooling`
# section, no `Guardrails` and no step budget - their apparatus is a set of
# grids to read - so `tool_absent` and `step_budget` have nothing here to
# derive from and are left out rather than invented. What the protocol does
# state is an order, and an order is exactly what a repository snapshot cannot
# hold: the report is byte-for-byte the same file whether the evidence was
# opened before the verdict was written or after it. The one act all nine DO
# prescribe - "each reference/<section>.md read" - is deliberately not gated:
# the arm with no skill installed has no such file to open, so a check on it
# would move this dimension by construction rather than by behaviour, and
# tools/eval-report.ts already reports it per arm as `reference read n/m`.
#
# The needle is `file_path=`, not the report's name. Every prompt in this world
# names the file the report lands in, an agent's opening TodoWrite quotes that
# name straight back, and a `then` of "AUDIT-OBSERVABILITY.md" would match that
# todo at step 1 and fail an ordering the agent in fact kept. A check nobody
# can pass penalises both arms equally, which this repository has paid for once
# already. Keying on the rendered argument matches the Write and the Edit and
# nothing the agent merely says. Its honest limit: a report written through a
# shell heredoc renders no `file_path=` at all, and the check then holds
# vacuously instead of firing.
trajectory:
  # from-skill(sequence): 17. **Run the verification commands** for each
  # question (see per-section grids) - step 20 of the same protocol is
  # **Produce the report**.
  #
  # The logging guideline is only worth a level if it agrees with the register
  # it points at, and the register is the half an observability audit does not
  # think to open. src/log.js alone names a REDACT set and reads as sufficient,
  # which is why the file gated here is the other one.
  - before: { first: "data/classification.json", then: "file_path=AUDIT-OBSERVABILITY.md" }
judge:
  criteria:
    - { dimension: outcome, text: "The request id is followed from arrival to the stored row" }
    - { dimension: outcome, text: "Detection time is reported as unmeasured, from the incident log" }
    - { dimension: tooling, text: "The redaction list is checked against the classification file" }
  threshold: pass_all
