fixture: frontend-vue
prompt: >
  src/pricing.js has no test coverage. Write robust tests for it following the
  project conventions. The suite runs with npm test (node --test, nothing to
  install).
gates:
  - grep_zero: { pattern: "waitForTimeout|Thread\\.sleep|sleep\\(" }
  - grep_min: { pattern: "priceWithTax", in: "src/", count: "2" }
judge:
  criteria:
    - "Boundary and error cases are covered, not only the happy path"
    - "The transcript shows a test failing before it passes"
  threshold: pass_all
