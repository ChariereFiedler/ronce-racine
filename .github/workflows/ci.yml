name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 = the documented minimum (package.json engines), 22 = current LTS.
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate (structure + routing + versioning + behavioral)
        run: npm test

      - name: Mutation check (the tests can fail)
        run: npm run test:mutation

      - name: Eval manifests dry-run
        run: npm run eval:dry
